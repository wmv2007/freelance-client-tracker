<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add lead and Email composer</title>
  <link rel="stylesheet" href="styles/add-lead.css">
</head>

<body>
  <main>
    <section class="add-lead">
      <div class="head">
        <h1>Add a lead</h1>
        <span>Everything you save here feeds the dashboard and the email tools</span>
      </div>
      <form class="new-lead" id="lead-form">
        <div class="client-data">
          <div class="sec">
            <label for="name">Client name</label>
            <input id="name" class="sec-input" type="name" placeholder="Business or person" required>
          </div>
          <div class="sec">
            <label for="email">Client email</label>
            <input id="email" class="sec-input" type="email" placeholder="name@example.com" required>
          </div>
        </div>
        <div class="platform-and-service">
          <div>
            <label for="platform">Platform</label>
            <select class="sec-input" name="platform" id="platform">
              <option value="Fiverr">Fiverr</option>
              <option value="Upwork">Upwork</option>
              <option value="Social media">Social media</option>
              <option value="Referral">Referral</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="service-wanted">Service wanted</label>
            <select class="sec-input" name="service-wanted" id="service-wanted">
              <option value="single-page website">Single-page website</option>
              <option value="single-page website + JavaScript">Single-page wesite + JavaScript</option>
              <option value="multi-page website">Multi-page website</option>
              <option value="multi-page website + JavaScript">Multi-page website + JavaScript</option>
              <option value="website redesign">Website redesign</option>
              <option value="maintenance and updates">Maintenance and updates</option>
            </select>
          </div>
        </div>
        <div class="amt-status-date">
          <div class="amt-container">
            <label for="amount">Quoted amount (USD)</label>
            <input id="amount" class="sec-input amount" type="number" required>
          </div>
          <div>
            <label for="status">Status</label>
            <select class="sec-input status" name="status" id="status">
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="replied">Replied</option>
              <option value="negotiating">Negotiating</option>
              <option value="deposit paid">Deposit paid</option>
              <option value="won">Won</option>
              <option value="delivered">Delivered</option>
              <option value="paid">Paid in full</option>
              <option value="lost">Lost</option>
            </select>
          </div>
          <div>
            <label for="date">Follow-up date</label>
            <input id="date" class="sec-input date" type="date">
          </div>
        </div>
        <div class="notes">
          <label for="notes">Notes</label>
          <Textarea id="notes" class="notes-text" rows="4"
            placeholder="What did they ask for? Any deadline?"></Textarea>
        </div>
        <div class="buttons">
          <button class="save-button">save lead</button>
          <a class="cancel-btn" href="dashboard.html">Cancel</a>
        </div>
      </form>
    </section>

    <section class="email-composer">
      <div class="head">
        <h1>Send an email</h1>
        <span>Pick a template, check the preview, send.</span>
      </div>
      <div class="btns">
        <button class="email-btn active">Follow-up nudge</button>
        <button class="email-btn">first reply</button>
        <button class="email-btn">projects started</button>
        <button class="email-btn">Delivered</button>
        <button class="email-btn">Payment reminder</button>
      </div>
      <form class="email-details">
        <label for="email-to">To</label>
        <input id="email-to" class="sec-input" type="email" placeholder="name@example.com">
        <label for="email-subject">Subject</label>
        <input id="email-subject" class="sec-input" type="text">
        <label for="email-message">Message</label>
        <textarea class="notes-text" name="message" id="email-message" rows="9" placeholder="message"></textarea>
        <div class="send-btn">
          <button type="button" class="send-email">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2L11 13"></path>
              <path d="M22 2l-7 20-4-9-9-4z"></path>
            </svg>
            Send email
          </button>
          <button type="button" class="save-draft">Save draft</button>
        </div>
      </form>
    </section>
  </main>

  <script src="scripts/data.js"></script>
  <script src="scripts/form.js"></script>
</body>

</html>
